<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Estilo de fuente -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/style.css" />
    <title>Pizza&Front</title>
  </head>
  <body>
    <!-- Header -->
    <header>
      <nav class="barra_navegacion_header">
        <div class="logo">
          <img src="./img/VectorPizza.svg" alt="imag_pizza" />
          <img src="./img/Pizza&Front.svg" alt="img_texto" />
        </div>
        <ul class="contenedor_enlaces_header">
          <li>
            <a href="">Home</a>
          </li>
          <li>
            <a href="">Ranking</a>
          </li>
          <li>
            <a href="">Promoción</a>
          </li>
          <li>
            <a href="">Contacto</a>
          </li>
        </ul>
      </nav>
    </header>
    <main>
      <!-- Contenedor seccion ppal -->
      <section class="flex-container">
        <!-- Subcontenedor imagen -->
        <div class="img_contenedor">
          <!-- <img src="" alt="img_pizza" /> -->
          <h2 class="titulo_img">
            Envio gratis <span style="color: white">comprando</span> 2 pizzas
          </h2>
        </div>
        <!-- Subcontenedor Menu-->
        <div class="menu">
          <h2 class="menu_titulo">Podio de Pizzas</h2>
          <!-- Contenedor Menu lista + img -->
          <div class="menu_container">
            <!-- contendeor menu lsita -->
            <div class="menu_lista_contenedor">
              <h3 class="menu_lista_titulo">Pizzas Top 5</h3>
              <ol class="menu_lista">
                <li>Muzzarella</li>
                <li>Hawaiana</li>
                <li>Muzzarella J&Morron</li>
                <li>Fugazzeta</li>
                <li>Calabresa</li>
              </ol>
            </div>
            <!-- Contenedor menu lis_img -->
            <div class="menu_lista_img"></div>
          </div>
        </div>
      </section>
    </main>
    <!-- Footer -->
    <footer class="barra_navegacion_footer">
      <div class="logo">
        <img src="./img/VectorPizza.svg" alt="imagen_pizza" />
        <img src="./img/Pizza&Front.svg" alt="imagen_logo" />
      </div>
      <ul class="contenedor_enlaces_footer">
        <li class="enlace1">
          <a href="">Home</a>
        </li>
        <li class="enlace2">
          <a href="">Ranking</a>
        </li>
        <li class="enlace3">
          <a href="">Promoción</a>
        </li>
        <li class="enlace4">
          <a href="">Contacto</a>
        </li>
      </ul>
    </footer>
  </body>
</html>
